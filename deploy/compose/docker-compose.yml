# Huxley reference deployment for a single host.
#
#   cd deploy/compose
#   ./install.sh                 # creates .env and secrets/ (first run only)
#   docker compose up -d --build # build from source; or omit --build to pull images
#
# Optional profiles:
#   --profile runner         A script runner (enrol it first; see docs/runners.md)
#   --profile observability  OpenTelemetry Collector (set HUXLEY_OTLP_ENDPOINT too)
#   --profile clamav         ClamAV, to scan uploads for malware (set
#                            HUXLEY_SCAN_PROVIDER=clamav too; docs/attachment-scanning.md)

name: huxley

x-huxley-env: &huxley-env
  HUXLEY_DATABASE__URL_FILE: /run/secrets/db_url
  HUXLEY_CRYPTO__KEK_FILE: /run/secrets/kek
  HUXLEY_TELEMETRY__LOG_FORMAT: json
  HUXLEY_TELEMETRY__ENVIRONMENT: ${HUXLEY_ENVIRONMENT:-production}
  HUXLEY_TELEMETRY__OTLP_ENDPOINT: ${HUXLEY_OTLP_ENDPOINT:-}
  # Every request reaches the API through Caddy or the web apps, which set
  # X-Forwarded-For to the real client address.
  HUXLEY_HTTP__TRUST_FORWARDED_FOR: "true"
  # Behind a CDN (Cloudflare, Azure Front Door): the header it sets to the
  # client's address, e.g. CF-Connecting-IP or X-Azure-ClientIP. Only with
  # the origin locked to the CDN (docs/operations.md, "Behind a CDN").
  HUXLEY_HTTP__CLIENT_IP_HEADER: ${HUXLEY_CLIENT_IP_HEADER:-}
  # Passkeys are bound to the staff app's host name.
  HUXLEY_AUTH__PUBLIC_URL: https://${HUXLEY_DOMAIN:-localhost}
  # Where the client portal lives, for the sign-in links it emails.
  HUXLEY_HTTP__PORTAL_PUBLIC_URL: https://${HUXLEY_PORTAL_DOMAIN:-portal.localhost}
  HUXLEY_EMAIL__SMTP_URL: ${HUXLEY_SMTP_URL:-}
  HUXLEY_EMAIL__FROM: ${HUXLEY_EMAIL_FROM:-Huxley <huxley@example.com>}
  # The script runner gateway (mutual TLS), reached by runners inside this
  # network as https://huxley:8443. Not published on the host.
  HUXLEY_RUNNERS__BIND: 0.0.0.0:8443
  HUXLEY_RUNNERS__HOSTS: "[huxley]"
  HUXLEY_RUNNERS__PUBLIC_URL: https://huxley:8443
  # Malware scanning of uploads (docs/attachment-scanning.md): off, clamav
  # (with --profile clamav) or metadefender.
  HUXLEY_UPLOADS__SCAN__PROVIDER: ${HUXLEY_SCAN_PROVIDER:-off}
  HUXLEY_UPLOADS__SCAN__WHILE_PENDING: ${HUXLEY_SCAN_WHILE_PENDING:-hold}
  HUXLEY_UPLOADS__SCAN__CLAMAV__ADDRESS: ${HUXLEY_CLAMAV_ADDRESS:-tcp://clamav:3310}
  HUXLEY_UPLOADS__SCAN__METADEFENDER__URL: ${HUXLEY_METADEFENDER_URL:-https://api.metadefender.com/v4}
  HUXLEY_UPLOADS__SCAN__METADEFENDER__API_KEY: ${HUXLEY_METADEFENDER_API_KEY:-}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: huxley
      POSTGRES_DB: huxley
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huxley -d huxley"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies migrations before the server starts. Larger deployments run this as
  # a separate step in their rollout pipeline.
  migrate:
    image: ghcr.io/usehuxley/huxley:${HUXLEY_VERSION:-latest}
    build: { context: ../.., dockerfile: docker/huxley.Dockerfile }
    command: ["migrate"]
    environment: *huxley-env
    secrets: [db_url, kek]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  huxley:
    image: ghcr.io/usehuxley/huxley:${HUXLEY_VERSION:-latest}
    build: { context: ../.., dockerfile: docker/huxley.Dockerfile }
    command: ["serve", "--roles", "all"]
    restart: unless-stopped
    environment: *huxley-env
    secrets: [db_url, kek]
    volumes:
      # Attachments. Back this up with the database (or set
      # HUXLEY_STORAGE__URL to an s3:// or az:// bucket instead).
      - huxley-objects:/var/lib/huxley/objects
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: ghcr.io/usehuxley/web:${HUXLEY_VERSION:-latest}
    build:
      context: ../..
      dockerfile: docker/frontend.Dockerfile
      args: { APP: web }
    restart: unless-stopped
    environment:
      HUXLEY_API_URL: http://huxley:8080
      ORIGIN: https://${HUXLEY_DOMAIN:-localhost}
      # Uploads pass through the web app (default limit is 512 KB).
      BODY_SIZE_LIMIT: 30M
      # Behind Caddy: take the client address from the header Caddy sets.
      ADDRESS_HEADER: ${HUXLEY_CLIENT_IP_HEADER:-X-Forwarded-For}
      XFF_DEPTH: "1"
    depends_on:
      huxley: { condition: service_healthy }

  portal:
    image: ghcr.io/usehuxley/portal:${HUXLEY_VERSION:-latest}
    build:
      context: ../..
      dockerfile: docker/frontend.Dockerfile
      args: { APP: portal }
    restart: unless-stopped
    environment:
      HUXLEY_API_URL: http://huxley:8080
      ORIGIN: https://${HUXLEY_PORTAL_DOMAIN:-portal.localhost}
      # Behind Caddy: take the client address from the header Caddy sets.
      ADDRESS_HEADER: ${HUXLEY_CLIENT_IP_HEADER:-X-Forwarded-For}
      XFF_DEPTH: "1"
    depends_on:
      huxley: { condition: service_healthy }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      HUXLEY_DOMAIN: ${HUXLEY_DOMAIN:-localhost}
      HUXLEY_PORTAL_DOMAIN: ${HUXLEY_PORTAL_DOMAIN:-portal.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, portal]

  # Runs scripts in rootless Podman sandboxes. Enrol it once with a token
  # from Settings → Script runners:
  #   docker compose run --rm runner enroll --server http://huxley:8080 --token hxr_…
  runner:
    image: ghcr.io/usehuxley/runner:${HUXLEY_VERSION:-latest}
    build: { context: ../.., dockerfile: docker/runner.Dockerfile }
    profiles: [runner]
    restart: unless-stopped
    command: ["run", "--pull-images"]
    # What nested rootless Podman needs. Never mount a container socket.
    devices: ["/dev/fuse"]
    security_opt: ["label=disable"]
    volumes:
      - runner-state:/var/lib/huxley-runner
      - runner-images:/home/podman/.local/share/containers
    depends_on:
      huxley: { condition: service_healthy }

  # Scans uploads for malware. Its signatures update themselves (freshclam)
  # and are kept in a volume. Starting can take a minute or two while it
  # loads them; uploads wait for their scan meanwhile.
  clamav:
    image: clamav/clamav:1.4
    profiles: [clamav]
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: [observability]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

secrets:
  db_password:
    file: ./secrets/db_password
  db_url:
    file: ./secrets/db_url
  # Key-encryption key for secrets at rest. Back it up with the database:
  # without it, encrypted data cannot be recovered.
  kek:
    file: ./secrets/kek

volumes:
  postgres-data:
  huxley-objects:
  caddy-data:
  caddy-config:
  runner-state:
  runner-images:
  clamav-db:
