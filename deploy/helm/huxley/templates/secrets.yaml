{{- include "huxley.validate" . -}}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "huxley.dbSecret" . }}
  labels: {{- include "huxley.labels" . | nindent 4 }}
  annotations:
    # Before the migration hook, and kept on uninstall.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.database.passwordKey }}: {{ .Values.database.password | quote }}
{{- end }}
{{- if not .Values.kek.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "huxley.kekSecret" . }}
  labels: {{- include "huxley.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.kek.key }}: {{ .Values.kek.value | quote }}
{{- end }}
