{{- if and .Values.storage.persistence.enabled (not .Values.storage.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "huxley.fullname" . }}-objects
  labels: {{- include "huxley.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  # Shared by the API, workers and scheduler.
  accessModes: [ReadWriteMany]
  {{- with .Values.storage.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.persistence.size }}
{{- end }}
