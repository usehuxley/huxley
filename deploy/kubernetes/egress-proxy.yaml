# Script pods' only way out: HTTP(S) through Huxley's SSRF policy (public
# addresses only; link-local never). Policy flags go in args, e.g.
# --egress-private-host=*.corp.example.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: huxley-egress-proxy
  labels: { app.kubernetes.io/name: huxley-egress-proxy }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: huxley-egress-proxy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: huxley-egress-proxy }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: proxy
          image: ghcr.io/usehuxley/runner
          args: ["egress-proxy", "--listen", "0.0.0.0:3128"]
          ports: [{ name: proxy, containerPort: 3128 }]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            tcpSocket: { port: proxy }
---
apiVersion: v1
kind: Service
metadata:
  name: huxley-egress-proxy
spec:
  selector: { app.kubernetes.io/name: huxley-egress-proxy }
  ports: [{ name: proxy, port: 3128, targetPort: proxy }]
