apiVersion: usehuxley.io/v1
kind: Workflow
metadata:
  key: quickbooks-invoice-status
  name: Update invoice status from QuickBooks Online
  description: >-
    Every hour, reads the balance of each synced invoice that isn't paid yet
    from QuickBooks and records it: paid invoices raise invoice.paid, and
    each client's balance and overdue amount (and credit hold) are worked
    out again. The first time, it also fetches each invoice's view-and-pay
    link for the client portal (QuickBooks Payments must be on). Uses the
    connection named quickbooks; run it at your MSP.
spec:
  triggers:
    - type: schedule
      interval: 1h
    - type: manual
  steps:
    - id: open
      type: core.invoice.unpaid
      with: { target: quickbooks, limit: 200 }
    - id: any
      type: if
      condition: "{{ steps.open.output.invoices | length > 0 }}"
      then:
        - id: read
          type: integration.action
          action: quickbooks/query
          connection: quickbooks
          with:
            query: >-
              {{ "select Id, Balance, TotalAmt from Invoice where Id in ('"
                 ~ (steps.open.output.invoices | map(attribute='remoteId') | join("','"))
                 ~ "') maxresults 1000" }}
            minorversion: 75
        - id: begin
          type: set_var
          vars: { statuses: [] }
        - id: each
          type: foreach
          items: "{{ steps.read.output.QueryResponse.Invoice or [] }}"
          as: inv
          steps:
            - id: add
              type: set_var
              vars:
                statuses: >-
                  {{ run.vars.statuses + [{'remote_id': inv.Id, 'amount_due': inv.Balance,
                     'amount_paid': inv.TotalAmt - inv.Balance, 'status': 'PAID' if inv.Balance == 0 else 'OPEN'}] }}
        - id: record
          type: core.invoice.status
          with:
            target: quickbooks
            statuses: "{{ run.vars.statuses }}"
        - id: links
          type: foreach
          items: "{{ steps.open.output.invoices | selectattr('needsLink') | list }}"
          as: inv
          steps:
            - id: link
              type: integration.action
              action: quickbooks/getInvoice
              connection: quickbooks
              continue_on_error: true
              with: { id: "{{ inv.remoteId }}", include: invoiceLink, minorversion: 75 }
            - id: has_link
              type: if
              condition: "{{ steps.link.output and steps.link.output.Invoice and steps.link.output.Invoice.InvoiceLink }}"
              then:
                - id: save_link
                  type: core.invoice.status
                  with:
                    target: quickbooks
                    statuses:
                      - remote_id: "{{ inv.remoteId }}"
                        pay_url: "{{ steps.link.output.Invoice.InvoiceLink }}"
  outputs:
    checked: "{{ steps.open.output.invoices | length }}"
