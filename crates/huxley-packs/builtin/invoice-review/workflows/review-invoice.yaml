apiVersion: usehuxley.io/v1
kind: Workflow
metadata:
  key: review-invoice
  name: Review invoices before they go out
  description: >-
    When an invoice is submitted for review, asks the reviewers named by the
    review rules it matched to approve it, ask for changes, or reject it,
    and records their decision. An approved review approves the invoice for
    sending and syncing. Add steps for levels (a second approval above a
    total), or change who reviews in Settings → Billing.
spec:
  triggers:
    - type: event
      event: invoice.submitted_for_review
  steps:
    - id: review
      type: approval
      title: "Review invoice {{ inputs.reference }} for {{ inputs.client }}"
      message: >-
        {{ inputs.total }} {{ inputs.currency }} over {{ inputs.lines }} lines{{
        ', ' ~ inputs.edited ~ ' changed by hand' if inputs.edited else '' }}{{
        '; the last invoice was ' ~ inputs.previousTotal if inputs.previousTotal else '' }}.
        Why it needs review: {{ inputs.reasons | join('; ') if inputs.reasons else 'asked for' }}.{{
        ' Changed since the last review: ' ~ inputs.changes ~ '.' if inputs.changes else '' }}
        Submitted by {{ inputs.submittedBy or 'someone' }}.
      approvers: "{{ inputs.reviewers }}"
      changes: true
      expires: 3d
    - id: decide
      type: core.invoice.review
      with:
        review_id: "{{ inputs.reviewId }}"
        decision: "{{ steps.review.output.decision }}"
        by: "{{ steps.review.output.by.name }}"
        comment: "{{ steps.review.output.comment or '' }}"
  outputs:
    decision: "{{ steps.review.output.decision }}"
