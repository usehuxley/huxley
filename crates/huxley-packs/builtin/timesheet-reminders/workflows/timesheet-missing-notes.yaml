apiVersion: usehuxley.io/v1
kind: Workflow
metadata:
  key: timesheet-missing-notes
  name: Remind people to add notes to their time
  description: >-
    Every Friday at 15:00, tells people how many of this period's time
    entries have no notes, before they submit their timesheet.
spec:
  triggers:
    - type: schedule
      cron: "0 15 * * 5"
  steps:
    - id: find
      type: core.timesheet.check
      with:
        check: missing_notes
    - id: remind
      type: foreach
      items: "{{ steps.find.output.people }}"
      as: person
      steps:
        - id: tell
          type: core.notify
          with:
            to: "{{ person.recipient }}"
            title: >-
              {{ person.missing_notes }} time {{ 'entry has' if person.missing_notes == 1 else 'entries have' }}
              no notes this period
            message: Notes tell your lead and the client what the time was for.
            url: "/time?week={{ person.period_start }}"
  outputs:
    reminded: "{{ steps.find.output.people | length }}"
