// Worker <-> runner protocol (design doc §6.9, ADR-025). Runners connect to
// the gateway with mutual TLS and pull their work.
syntax = "proto3";

package huxley.runner.v1;

service Runner {
  // Proves the connection works and the runner is still allowed in.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // A new certificate for the runner's new key, before the old one expires.
  rpc Renew(RenewRequest) returns (RenewResponse);
  // The next script to run, if there is one.
  rpc Next(NextRequest) returns (NextResponse);
  // A claimed script's result.
  rpc Report(ReportRequest) returns (ReportResponse);
}

message HeartbeatRequest {
  // What the runner can run, e.g. "pwsh", "python".
  repeated string languages = 1;
  string version = 2;
}

message HeartbeatResponse {
  string runner_id = 1;
  string runner_name = 2;
  // Unix seconds when the runner's certificate expires (0 for external ones).
  int64 certificate_expires_at = 3;
}

message RenewRequest {
  // PEM certificate signing request for the runner's new key.
  string csr_pem = 1;
}

message RenewResponse {
  string certificate_pem = 1;
  int64 expires_at = 2;
}

message NextRequest {
  // The languages this runner can run now.
  repeated string languages = 1;
}

message Task {
  string id = 1;
  string language = 2;
  string source = 3;
  // The script's parameters, a JSON object.
  string inputs_json = 4;
  int32 timeout_secs = 5;
  // Environment variables for the script, credentials included.
  map<string, string> env = 6;
  // Values the runner must scrub from the output and logs it reports.
  repeated string redact = 7;
}

message NextResponse {
  // Unset: nothing to do.
  optional Task task = 1;
}

message ReportRequest {
  string task_id = 1;
  bool succeeded = 2;
  // The script's result as JSON, if it produced one.
  optional string output_json = 3;
  optional string error = 4;
  optional int32 exit_code = 5;
  string logs = 6;
}

message ReportResponse {}
