[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/usehuxley/huxley"
homepage = "https://usehuxley.com"
authors = ["Huxley contributors"]

[workspace.dependencies]
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-ring", "router"] }
tonic-prost = "0.14"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }
prost = "0.14"
protox = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-stream = { version = "0.1", default-features = false, features = ["net"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
x509-parser = "0.18"
# Internal crates
huxley-api = { path = "crates/huxley-api" }
huxley-auth = { path = "crates/huxley-auth" }
huxley-authz = { path = "crates/huxley-authz" }
huxley-core = { path = "crates/huxley-core" }
huxley-crypto = { path = "crates/huxley-crypto" }
huxley-sso = { path = "crates/huxley-sso" }
huxley-db = { path = "crates/huxley-db" }
huxley-email = { path = "crates/huxley-email" }
huxley-entity = { path = "crates/huxley-entity" }
huxley-modules = { path = "crates/huxley-modules" }
huxley-notify = { path = "crates/huxley-notify" }
huxley-engine = { path = "crates/huxley-engine" }
huxley-expr = { path = "crates/huxley-expr" }
huxley-hwf = { path = "crates/huxley-hwf" }
huxley-forms = { path = "crates/huxley-forms" }
huxley-integrations = { path = "crates/huxley-integrations" }
huxley-orgs = { path = "crates/huxley-orgs" }
huxley-runners = { path = "crates/huxley-runners" }
huxley-scripts = { path = "crates/huxley-scripts" }
huxley-storage = { path = "crates/huxley-storage" }
huxley-telemetry = { path = "crates/huxley-telemetry" }
huxley-triggers = { path = "crates/huxley-triggers" }
huxley-variables = { path = "crates/huxley-variables" }
huxley-workflows = { path = "crates/huxley-workflows" }

# Async / HTTP
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "request-id", "timeout", "limit", "sensitive-headers", "catch-panic", "util"] }
http = "1.5"
# Outbound HTTP (KMS providers). Same TLS stack object_store already uses.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }

# Data
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.29", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
base64 = "0.23"
# Workflow documents (HWF): YAML with parse budgets, and the published JSON Schema.
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize", "serialize"] }
schemars = "1.2"
# Time zones for schedules; the bundled tz database works in minimal images.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
# Run inputs against a workflow's input schema. No remote or file $ref resolution.
jsonschema = { version = "0.63", default-features = false }
# Expressions (ADR-005): sandboxed, no loaders; fuel bounds evaluation.
minijinja = { version = "3.1", default-features = false, features = ["builtins", "debug", "fuel", "json", "serde", "urlencode", "preserve_order", "std_collections", "adjacent_loop_items", "loop_controls"] }
regex = "1"
minijinja-contrib = { version = "3.1", features = ["pycompat", "datetime", "timezone"] }

# Crypto
argon2 = { version = "0.6", features = ["zeroize"] }
sha2 = "0.11"
getrandom = "0.4"
subtle = "2.6"
ring = "0.17"
zeroize = "1.8"
# MPL-2.0: licence exception approved for these crates only (ADR-012, deny.toml).
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation", "conditional-ui"] }
url = "2"
object_store = { version = "0.14", default-features = false, features = ["fs", "aws", "azure"] }
bytes = "1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1-rustls-tls"] }
openidconnect = { version = "4.1", default-features = false, features = ["reqwest", "rustls-tls", "accept-string-booleans"] }

# Config / CLI / errors
clap = { version = "4.6", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
secrecy = { version = "0.10", features = ["serde"] }
thiserror = "2"
anyhow = "1"

# Observability (OpenTelemetry is the only instrumentation standard: ADR-015)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.33"
tracing-opentelemetry = "0.34"

# API docs
utoipa = { version = "6", features = ["axum_extras", "uuid", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
