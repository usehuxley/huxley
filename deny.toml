# cargo-deny: licenses, advisories, and sources (ADR-012).
# Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Marvin attack: timing leaks recover an RSA *private* key during decryption
  # or signing. `rsa` comes in only through webauthn-rs (crypto-glue), which
  # uses it to verify RS256 passkey signatures with public keys. Huxley holds
  # no RSA private keys. Revisit if anything starts using RSA private keys.
  { id = "RUSTSEC-2023-0071", reason = "rsa is used only for public-key signature verification (passkeys)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses compatible with distributing Huxley under MIT.
# Copyleft licenses (GPL, LGPL, AGPL, SSPL) and source-available licenses are
# intentionally absent. Adding a license here needs a maintainer review.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "Unlicense",
]
# Reviewed exceptions (ADR-012). MPL-2.0 is file-level copyleft: using these
# crates unmodified doesn't affect Huxley's MIT license. Scoped to the
# webauthn-rs project's crates; don't widen to other MPL crates without review.
exceptions = [
  { crate = "webauthn-rs", allow = ["MPL-2.0"] },
  { crate = "webauthn-rs-core", allow = ["MPL-2.0"] },
  { crate = "webauthn-rs-proto", allow = ["MPL-2.0"] },
  { crate = "webauthn-attestation-ca", allow = ["MPL-2.0"] },
  { crate = "crypto-glue", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
