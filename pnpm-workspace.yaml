packages:
  - apps/*
  - packages/*

# Dependency install scripts are blocked unless listed here (supply-chain hardening).
allowBuilds:
  # Its postinstall only auto-installs git hooks; run `pnpm exec lefthook install` instead.
  lefthook: false
  # Its postinstall only double-checks the platform binary, which pnpm
  # installs anyway as an optional dependency (the docs site builds without it).
  esbuild: false
