name: Container images

# Pull requests: build and scan only.
# main: build, scan, and push :main and :sha-<commit>.
# Tags (v*): also push :<version> and :latest, attach an SBOM, and sign with
# cosign (keyless, via GitHub OIDC).
#
# Images are linux/amd64 for now. arm64 will be added with native arm runners,
# because emulated Rust builds are too slow to run on every push.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: huxley
            dockerfile: docker/huxley.Dockerfile
            build-args: ""
          - name: runner
            dockerfile: docker/runner.Dockerfile
            build-args: ""
          - name: web
            dockerfile: docker/frontend.Dockerfile
            build-args: APP=web
          - name: portal
            dockerfile: docker/frontend.Dockerfile
            build-args: APP=portal
    env:
      IMAGE: ghcr.io/usehuxley/${{ matrix.name }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once into the local daemon so it can be scanned before pushing.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan for vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:scan
          fail-build: true
          severity-cutoff: critical
          only-fixed: true

      - name: Push
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: SBOM (CycloneDX)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.name }}.cdx.json

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign
        if: startsWith(github.ref, 'refs/tags/v')
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
