name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: huxley
          POSTGRES_PASSWORD: huxley
          POSTGRES_DB: huxley
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U huxley -d huxley"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # Dev-mode OpenBao for the Vault key-encryption-key tests (in memory).
      openbao:
        image: openbao/openbao:2.4.3
        env:
          BAO_DEV_ROOT_TOKEN_ID: ci-root
        ports: ["8200:8200"]
      # An IMAP and SMTP server for the mail fetching tests.
      greenmail:
        image: greenmail/standalone:2.1.2
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users.login=email
        ports: ["3025:3025", "3143:3143"]
    env:
      HUXLEY_TEST_DATABASE_URL: postgres://huxley:huxley@localhost:5432/huxley
      HUXLEY_TEST_IMAP: localhost:3143:3025
      HUXLEY_REQUIRE_IMAP_TESTS: "1"
      # Fail rather than skip if the database tests can't find Postgres.
      HUXLEY_REQUIRE_DB_TESTS: "1"
      HUXLEY_TEST_VAULT_ADDR: http://localhost:8200
      HUXLEY_TEST_VAULT_TOKEN: ci-root
      HUXLEY_REQUIRE_VAULT_TESTS: "1"
      # Fail rather than skip the script sandbox tests (rootless Podman).
      HUXLEY_REQUIRE_PODMAN_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Pull the script runner images
        run: |
          podman version
          podman pull -q docker.io/library/python:3.13-alpine
          podman pull -q docker.io/library/node:26.13.1-alpine
          podman pull -q mcr.microsoft.com/powershell:7.5-alpine-3.20
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --workspace --locked --doc

  cargo-deny:
    name: Licenses and advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # helm comes with the runner image.
      - name: Lint and validate the rendered manifests
        run: |
          set -euo pipefail
          helm version --short
          mkdir -p rendered
          for values in deploy/helm/huxley/ci/*-values.yaml; do
            helm lint deploy/helm/huxley -f "$values"
            helm template ci deploy/helm/huxley -f "$values" > "rendered/$(basename "$values" .yaml).yaml"
          done
          # KEDA's CRDs come from the community schema catalogue.
          docker run --rm -v "$PWD/rendered:/rendered:ro" ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /rendered
          # Defaults alone must refuse to render (no database configured).
          if helm template ci deploy/helm/huxley > /dev/null 2>&1; then
            echo "::error::the chart rendered without database settings"
            exit 1
          fi

  observability:
    name: Dashboards and alert rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Alert rules are valid and their tests pass
        working-directory: deploy/observability/alerts
        run: |
          docker run --rm -v "$PWD:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.2.1 check rules huxley.rules.yaml
          docker run --rm -v "$PWD:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.2.1 test rules huxley.rules.test.yaml
      - name: Dashboards match their generator
        working-directory: deploy/observability/dashboards
        run: |
          python3 generate.py
          if ! git diff --exit-code -- .; then
            echo "::error::Edit generate.py and run it; don't edit the dashboard JSON by hand."
            exit 1
          fi

  js:
    name: Frontend (check, lint, tests, e2e)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `check` runs svelte-kit sync, which generates the route types lint relies on.
      - run: pnpm check
      - run: pnpm lint
      # The browser download sometimes stalls forever on runners; cap each
      # attempt and retry rather than burning the job's 6h default.
      - name: Install Playwright browser
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            timeout 240 pnpm --filter @usehuxley/web exec playwright install --with-deps chromium && exit 0
            echo "playwright install attempt $attempt failed or stalled; retrying"
          done
          exit 1
      - run: pnpm test

  e2e:
    name: End-to-end (${{ matrix.modules }})
    runs-on: ubuntu-24.04
    # Every module's tests run with it on, and the whole suite runs with
    # every module off (an automation-only install), as the plan requires.
    strategy:
      fail-fast: false
      matrix:
        include:
          - modules: modules off
            preset: automation
          - modules: service desk modules on
            preset: service-desk
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: huxley
          POSTGRES_PASSWORD: huxley
          POSTGRES_DB: huxley
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U huxley -d huxley"
          --health-interval 2s --health-timeout 5s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.34.0
        ports: ["1025:1025", "8025:8025"]
    env:
      HUXLEY_DATABASE__URL: postgres://huxley:huxley@localhost:5432/huxley
      # Throwaway key for the CI database only.
      HUXLEY_CRYPTO__KEK: Y2ktb25seS1rZXktZm9yLXRoZS1lMmUtZGF0YWJhc2U=
      HUXLEY_HTTP__BIND: 127.0.0.1:8080
      HUXLEY_HTTP__TRUST_FORWARDED_FOR: "true"
      HUXLEY_HTTP__COOKIE_SECURE: "false"
      # Every browser test signs in from 127.0.0.1; the default 20/min is too
      # tight for the whole suite (now well over a hundred browser tests).
      HUXLEY_HTTP__LOGIN_ATTEMPTS_PER_MINUTE: "1000"
      # Passkeys are bound to the origin the browser sees: Playwright's preview server.
      HUXLEY_AUTH__PUBLIC_URL: http://localhost:4173
      # The assistant streaming test runs a mock AI provider on 127.0.0.1.
      HUXLEY_ENGINE__EGRESS__PRIVATE_HOSTS: "[127.0.0.1]"
      # The suite queues many workflow runs at once (approvals, reviews,
      # syncs): more workers keep their steps from waiting behind each other.
      HUXLEY_ENGINE__CONCURRENCY: "32"
      # Real SMTP to Mailpit; the email e2e tests read it through its API.
      HUXLEY_EMAIL__SMTP_URL: smtp://127.0.0.1:1025
      HUXLEY_EMAIL__FROM: Huxley <huxley@example.com>
      MAILPIT_URL: http://127.0.0.1:8025
      # Portal sign-in links point at the portal's preview server.
      HUXLEY_HTTP__PORTAL_PUBLIC_URL: http://localhost:4174
      HUXLEY_API_URL: http://127.0.0.1:8080
      E2E_EMAIL: e2e@example.com
      E2E_PASSWORD: e2e test passphrase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: cargo build --locked -p huxley-server
      - name: Bootstrap the instance
        run: |
          echo "$E2E_PASSWORD" | ./target/debug/huxley admin bootstrap \
            --org-name "E2E MSP" --email "$E2E_EMAIL" --name "E2E User" --password-stdin \
            --preset "${{ matrix.preset }}"
      # The datasets SQL console's login: a member of the reader role only.
      - name: Create the SQL console login
        env:
          PGPASSWORD: huxley
        run: |
          psql -h localhost -U huxley -d huxley -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE huxley_console LOGIN PASSWORD 'console-e2e'" \
            -c "GRANT huxley_datasets_reader TO huxley_console"
      - name: Start the API
        env:
          HUXLEY_DATASETS__CONSOLE_URL: postgres://huxley_console:console-e2e@localhost:5432/huxley
        run: |
          ./target/debug/huxley serve --roles all > api.log 2>&1 &
          for i in $(seq 60); do ./target/debug/huxley healthcheck --addr 127.0.0.1:8080 && exit 0; sleep 1; done
          cat api.log; exit 1
      - run: pnpm install --frozen-lockfile
      # The browser download sometimes stalls forever on runners; cap each
      # attempt and retry rather than burning the job's 6h default.
      - name: Install Playwright browser
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            timeout 240 pnpm --filter @usehuxley/web exec playwright install --with-deps chromium && exit 0
            echo "playwright install attempt $attempt failed or stalled; retrying"
          done
          exit 1
      # Playwright builds each app and serves it with `vite preview`.
      - run: pnpm test:e2e
        env:
          # Tests that need modules on (or off) run only in that job.
          E2E_PRESET: ${{ matrix.preset }}
      - name: Audit chain is intact after the run
        run: ./target/debug/huxley admin verify-audit
      - if: failure()
        run: cat api.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.preset }}
          path: apps/*/test-results/
          retention-days: 7

  api-client:
    name: API client is up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm api-client:generate
      - name: Fail if generated files changed
        run: |
          if ! git diff --exit-code -- packages/api-client; then
            echo "::error::The OpenAPI document changed. Run 'just api-client' and commit the result."
            exit 1
          fi
