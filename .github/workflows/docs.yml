# The documentation site (apps/docs), on Cloudflare Pages.
# Pull requests build it (dead links fail the build). Pushes to main also
# deploy it, once the repository has the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets and the CLOUDFLARE_PAGES_PROJECT variable
# (see apps/docs/README.md).
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "apps/docs/**", "schemas/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "apps/docs/**", "schemas/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Build (and deploy from main)
    runs-on: ubuntu-latest
    # Job-level, so the deploy step's condition can see whether it's set.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @usehuxley/docs...
      - run: pnpm --filter @usehuxley/docs build
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'huxley-docs' }}
        run: >-
          pnpm dlx wrangler@4.164.0 pages deploy apps/docs/.vitepress/dist
          --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA"
